spring.application.name=facturacion
server.port=8080

# ==========================================
# --- BASE DE DATOS PRINCIPAL (MySQL) ---
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/facturacion_db?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=hutini15
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate para que cree las tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# --- Base de datos en memoria (H2) - COMENTADA ---
# (Descomentar solo si necesitas hacer tests sin MySQL)
# ==========================================
# spring.datasource.url=jdbc:h2:mem:facturacion;DB_CLOSE_DELAY=-1
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.h2.console.enabled=true

# ==========================================
# --- CONFIGURACIONES DE COMPORTAMIENTO ---
# ==========================================
# La conversión entidad -> DTO se hace dentro de la transacción del service
spring.jpa.open-in-view=false

# Paginación del listado de facturas (?page=0&size=10): nunca más de 100 filas por pedido,
# aunque el cliente pida un "size" mayor.
spring.data.web.pageable.max-page-size=100

# Para que el frontend pueda mostrar el mensaje de los errores 400/404/409
server.error.include-message=always

# El frontend manda campos extra (p. ej. precioUnitario): se ignoran, el precio sale de la base
spring.jackson.deserialization.fail-on-unknown-properties=false

# Datos de prueba al arrancar (no duplica: se puede dejar en true):
#   - datos base: puntos de venta, monedas y listas de precios (config/DatosDePrueba)
#   - seeder: 100 clientes y 100 artículos de tecnología desde resources/seed/*.csv (config/CargadorDatosDemo)
# En producción, con datos reales, poner false.
app.cargar-datos-prueba=true

# ==========================================
# --- CONFIGURACIÓN ARCA / AFIP (Homologación) ---
# ==========================================
afip.cuit=20451384733
# Condición frente al IVA del EMISOR. Define la letra del comprobante:
#   RESPONSABLE_INSCRIPTO -> emite A o B (según el cliente)   |   MONOTRIBUTO o EXENTO -> emite C
afip.condicion-iva-emisor=RESPONSABLE_INSCRIPTO
afip.cert.path=src/main/resources/cert/certificado_test.crt
afip.key.path=src/main/resources/cert/privada_test.key
afip.wsaa.url=https://wsaahomo.afip.gov.ar/ws/services/LoginCms
afip.wsfe.url=https://wswhomo.afip.gov.ar/wsfev1/service.asmx